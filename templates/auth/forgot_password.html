{% extends "base.html" %}
{% block title %}Account Recovery | NeuroCardioAI{% endblock %}

{% block content %}
<section style="min-height:100vh; background:linear-gradient(120deg,#1e3c72,#2a5298); padding-top:120px;">
<div class="container">
<div class="row justify-content-center">

<div class="col-lg-5">
<div class="card shadow-lg border-0" style="border-radius:20px;">
<div class="card-body p-5">

<h3 class="text-center mb-4 fw-bold">Secure Account Recovery</h3>

<form method="POST">

<div class="mb-3">
<label>Email</label>
<input type="email" name="email" class="form-control" required>
</div>

<div class="mb-3">
<label>Phone Number</label>
<input type="text" name="phone" class="form-control" required>
</div>

<div class="mb-3">
<label>Age</label>
<input type="number" name="age" class="form-control" required>
</div>

<button class="btn btn-primary w-100 btn-lg">
Verify Identity
</button>

</form>

<div class="text-center mt-3">
<a href="{{ url_for('auth.login') }}">Back to Login</a>
</div>

</div>
</div>
</div>

</div>
</div>
</section>
{% endblock %}
