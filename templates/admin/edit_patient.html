{% extends "base.html" %}

{% block title %}Edit Patient{% endblock %}

{% block content %}
<div class="container mt-4">

<h3>Edit Patient</h3>

<form method="POST">

<div class="mb-3">
<label>Name</label>
<input type="text" name="full_name" class="form-control"
value="{{ patient.user.full_name }}">
</div>

<div class="mb-3">
<label>Email</label>
<input type="email" name="email" class="form-control"
value="{{ patient.user.email }}">
</div>

<div class="mb-3">
<label>Age</label>
<input type="number" name="age" class="form-control"
value="{{ patient.user.age }}">
</div>

<div class="mb-3">
<label>Gender</label>
<input type="text" name="gender" class="form-control"
value="{{ patient.user.gender }}">
</div>

<div class="mb-3">
<label>Phone</label>
<input type="text" name="phone" class="form-control"
value="{{ patient.user.phone }}">
</div>

<div class="mb-3">
<label>Medical Record Number</label>
<input type="text" name="medical_record_number" class="form-control"
value="{{ patient.medical_record_number }}">
</div>

<div class="mb-3">
<label>Blood Type</label>
<input type="text" name="blood_type" class="form-control"
value="{{ patient.blood_type }}">
</div>

<button class="btn btn-primary">Update Patient</button>

</form>

</div>
{% endblock %}
