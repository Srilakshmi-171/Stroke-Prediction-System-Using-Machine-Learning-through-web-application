{% extends "base.html" %}

{% block title %}Server Error - NeuroCardioAI{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="error-template">
                <h1 class="display-1 text-danger">500</h1>
                <h2 class="mb-4">Internal Server Error</h2>
                <div class="error-details mb-4">
                    Sorry, something went wrong on our end. Please try again later.
                </div>
                <div class="error-actions">
                    <a href="{{ url_for('main.home') }}" class="btn btn-primary btn-lg">
                        <i class="fas fa-home"></i> Go to Homepage
                    </a>
                    <a href="{{ url_for('main.prediction') }}" class="btn btn-outline-primary btn-lg">
                        <i class="fas fa-stethoscope"></i> New Prediction
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
