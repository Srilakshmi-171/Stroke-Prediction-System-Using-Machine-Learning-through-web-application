{% extends "base.html" %}

{% block title %}Test Email - NeuroCardioAI{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="fas fa-envelope"></i> Email Configuration Test</h5>
                </div>
                <div class="card-body">
                    <button class="btn btn-primary mb-3" onclick="testEmailConfig()">
                        <i class="fas fa-sync-alt"></i> Check Email Configuration
                    </button>
                    
                    <div id="emailConfigResult" style="display: none;" class="mb-3"></div>
                    
                    <button class="btn btn-success" onclick="sendTestEmail()">
                        <i class="fas fa-paper-plane"></i> Send Test Email
                    </button>
                    
                    <div id="testEmailResult" style="display: none;" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
async function testEmailConfig() {
    const resultDiv = document.getElementById('emailConfigResult');
    resultDiv.innerHTML = '<div class="alert alert-info">Checking configuration...</div>';
    resultDiv.style.display = 'block';
    
    try {
        const response = await fetch('/test-email-setup');
        const data = await response.json();
        
        let html = '<div class="alert alert-info"><h6>Email Configuration:</h6><ul>';
        for (const [key, value] of Object.entries(data.config)) {
            html += `<li><strong>${key}:</strong> ${value}</li>`;
        }
        html += '</ul>';
        
        if (data.test_email_sent) {
            html += '<p class="text-success">✅ Test email sent successfully!</p>';
        } else if (data.test_email_error) {
            html += `<p class="text-danger">❌ Test email failed: ${data.test_email_error}</p>`;
        }
        
        html += `<p><strong>Your email:</strong> ${data.user_email}</p>`;
        html += '</div>';
        
        resultDiv.innerHTML = html;
        
    } catch (error) {
        resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
    }
}

async function sendTestEmail() {
    const resultDiv = document.getElementById('testEmailResult');
    resultDiv.innerHTML = '<div class="alert alert-info">Sending test email...</div>';
    resultDiv.style.display = 'block';
    
    try {
        const response = await fetch('/test-email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        });
        const data = await response.json();
        
        if (data.success) {
            resultDiv.innerHTML = '<div class="alert alert-success">✅ Test email sent! Check your inbox.</div>';
        } else {
            resultDiv.innerHTML = `<div class="alert alert-danger">❌ Failed: ${data.error}</div>`;
        }
    } catch (error) {
        resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
    }
}
</script>
{% endblock %}
